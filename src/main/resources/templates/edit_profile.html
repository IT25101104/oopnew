<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wedding Planner - Edit Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="/dashboard" class="brand">✨ Wedding Planner</a>
            <a href="/logout" class="btn btn-secondary">Sign Out</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card dashboard-card" style="max-width: 500px;">
            <div class="glass-header text-center">
                <h2 class="mb-0">Edit Details</h2>
            </div>
            <div class="glass-body">
                <form action="/update" method="post">
                    <div class="form-group">
                        <label class="form-label">Email Address (Cannot change)</label>
                        <input type="email" class="form-control" th:value="${user.email}" disabled style="opacity: 0.7;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Partner's Name</label>
                        <input type="text" name="partnerName" class="form-control" th:value="${user.partnerName}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Wedding Date</label>
                        <input type="date" name="weddingDate" class="form-control" th:value="${user.weddingDate}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" name="phoneNumber" class="form-control" th:value="${user.phoneNumber}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Wedding Location</label>
                        <input type="text" name="weddingLocation" class="form-control" th:value="${user.weddingLocation}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Expected Guest Count</label>
                        <input type="number" name="guestCount" class="form-control" th:value="${user.guestCount}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Estimated Budget ($)</label>
                        <input type="number" step="0.01" name="budget" class="form-control" th:value="${user.budget}" required>
                    </div>
                    <div class="d-flex justify-between mt-4">
                        <a href="/dashboard" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
