<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wedding Planner - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="center-wrapper">
        <div class="glass-card auth-card">
            <div class="glass-header text-center">
                <h2 class="title-gradient mb-0">Welcome Back</h2>
            </div>
            <div class="glass-body">
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                
                <form action="/login" method="post">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block mt-4">Log In</button>
                </form>
                
                <div class="text-center mt-4">
                    <a href="/register" class="link-muted">Don't have an account? Sign up</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
